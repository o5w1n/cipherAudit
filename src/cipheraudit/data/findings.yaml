# Finding catalog (TRD §5a). All human-facing wording lives here, not in code.
# `technical` may use {placeholders} filled from the finding's evidence.
# `score_impact` overrides the severity defaults in evaluation/scoring.py.
# NIST references name the document and topic; confirm current revisions and clause numbers
# before publishing reports externally (PRD §10, open question 2).

# --- Protocols -------------------------------------------------------------
- id: PROTO_SSL2_ENABLED
  title: "Server accepts SSL 2.0"
  severity: critical
  plain: >
    Your server still speaks SSL 2.0, a version of the security protocol from 1995 that is completely
    broken. Attackers can use it to decrypt traffic, including traffic on modern connections that share
    the same certificate key.
  technical: "SSLv2 SERVER-HELLO returned ({sslv2_ciphers} cipher kinds)."
  nist: ["NIST SP 800-52 Rev. 2: SSL 2.0 shall not be used"]
  remediation: "Disable SSL 2.0 completely. Allow only TLS 1.2 and TLS 1.3."

- id: PROTO_SSL3_ENABLED
  title: "Server accepts SSL 3.0"
  severity: critical
  plain: >
    Your server still accepts SSL 3.0, retired in 2015 after the POODLE attack showed it could leak
    secrets such as login cookies. No modern browser needs it.
  technical: "SSLv3 ServerHello received for an SSLv3 ClientHello."
  nist: ["NIST SP 800-52 Rev. 2: SSL 3.0 shall not be used"]
  remediation: "Disable SSL 3.0. Allow only TLS 1.2 and TLS 1.3."

- id: PROTO_TLS10_ENABLED
  title: "Server accepts TLS 1.0"
  severity: high
  plain: >
    Your server still accepts a version of the security protocol from 1999. It has known weaknesses and
    modern browsers no longer use it, so keeping it switched on only helps attackers.
  technical: "TLS 1.0 negotiated successfully."
  nist: ["NIST SP 800-52 Rev. 2: TLS 1.2 minimum; TLS 1.0 not permitted"]
  remediation: "Disable TLS 1.0 and TLS 1.1 in your server's TLS settings. Keep TLS 1.2 and TLS 1.3."

- id: PROTO_TLS11_ENABLED
  title: "Server accepts TLS 1.1"
  severity: high
  plain: >
    Your server still accepts TLS 1.1, which was formally deprecated in 2021. It lacks modern encryption
    modes, and browsers dropped it years ago.
  technical: "TLS 1.1 negotiated successfully."
  nist: ["NIST SP 800-52 Rev. 2: TLS 1.2 minimum; TLS 1.1 not permitted"]
  remediation: "Disable TLS 1.1 (and TLS 1.0). Keep TLS 1.2 and TLS 1.3."

- id: PROTO_NO_MODERN_TLS
  title: "Server supports neither TLS 1.2 nor TLS 1.3"
  severity: critical
  plain: >
    None of the protocol versions considered safe today work on your server. Every connection uses an
    outdated version with known weaknesses.
  technical: "Neither TLS 1.2 nor TLS 1.3 negotiated."
  nist: ["NIST SP 800-52 Rev. 2: servers shall support TLS 1.2"]
  remediation: "Upgrade the server's TLS library and enable TLS 1.2 and TLS 1.3."

- id: PROTO_TLS13_MISSING
  title: "TLS 1.3 is not enabled"
  severity: low
  plain: >
    Your server does not offer TLS 1.3, the current version of the protocol. TLS 1.3 is faster and removes
    many older, weaker options entirely.
  technical: "TLS 1.3 ClientHello not accepted."
  nist: ["NIST SP 800-52 Rev. 2: servers should support TLS 1.3"]
  remediation: "Enable TLS 1.3 alongside TLS 1.2. Most current web servers support it with a one-line change."

# --- Cipher suites ---------------------------------------------------------
- id: CIPHER_NULL
  title: "Server accepts unencrypted (NULL) cipher suites"
  severity: critical
  plain: >
    Your server can agree to send data with no encryption at all. Anyone on the network path could read it.
  technical: "NULL-encryption suites accepted: {ciphers}"
  nist: ["NIST SP 800-52 Rev. 2: approved cipher suites only"]
  remediation: "Remove all NULL cipher suites from the server's cipher list."

- id: CIPHER_ANON
  title: "Server accepts anonymous cipher suites"
  severity: critical
  plain: >
    Your server can set up a connection without proving its identity. An attacker can pretend to be your
    server and read or change everything.
  technical: "Anonymous (aNULL) suites accepted: {ciphers}"
  nist: ["NIST SP 800-52 Rev. 2: server authentication required"]
  remediation: "Remove anonymous (aNULL / ADH / AECDH) cipher suites."

- id: CIPHER_EXPORT
  title: "Server accepts export-grade cipher suites"
  severity: critical
  plain: >
    Your server still allows 1990s "export" encryption that was deliberately weakened. It can be broken
    in hours on ordinary hardware.
  technical: "Export suites accepted: {ciphers}"
  nist: ["NIST SP 800-131A Rev. 2: key lengths below 112 bits disallowed"]
  remediation: "Remove all EXPORT cipher suites."

- id: CIPHER_RC4
  title: "Server accepts RC4 cipher suites"
  severity: high
  plain: >
    Your server allows RC4, an encryption method with statistical weaknesses that can reveal parts of
    encrypted traffic. It has been banned from TLS since 2015.
  technical: "RC4 suites accepted: {ciphers}"
  nist: ["NIST SP 800-52 Rev. 2: RC4 not approved"]
  remediation: "Remove RC4 cipher suites."

- id: CIPHER_DES
  title: "Server accepts single-DES or RC2 cipher suites"
  severity: high
  plain: >
    Your server allows encryption with keys short enough to be broken by brute force today.
  technical: "DES/RC2 suites accepted: {ciphers}"
  nist: ["NIST SP 800-131A Rev. 2: DES disallowed"]
  remediation: "Remove DES and RC2 cipher suites."

- id: CIPHER_3DES
  title: "Server accepts 3DES or other 64-bit block ciphers"
  severity: medium
  plain: >
    Your server allows old encryption methods with a small block size. On long connections an attacker
    who records enough traffic can recover secrets such as session cookies (the SWEET32 attack).
  technical: "64-bit block suites accepted: {ciphers}"
  nist: ["NIST SP 800-131A Rev. 2: TDEA disallowed for encryption after 2023"]
  remediation: "Remove 3DES (DES-CBC3), IDEA and other 64-bit block cipher suites."

- id: CIPHER_CBC
  title: "Server accepts CBC-mode cipher suites"
  severity: low
  plain: >
    Your server allows an older style of encryption (CBC mode) that has been the target of several
    attacks over the years. Modern encryption (AES-GCM or ChaCha20) avoids the whole class of problems.
  technical: "CBC suites accepted on TLS 1.2 or earlier: {count} suites"
  nist: ["NIST SP 800-52 Rev. 2: prefer AEAD cipher suites"]
  remediation: "Prefer AES-GCM and ChaCha20-Poly1305 suites; remove CBC suites when old clients allow it."

- id: CIPHER_NO_FORWARD_SECRECY
  title: "Some connections lack forward secrecy"
  severity: medium
  plain: >
    Your server accepts key exchanges where a single stolen server key would let an attacker decrypt
    recordings of past traffic. Forward-secret key exchange (ECDHE) prevents this.
  technical: "Static RSA/DH key exchange suites accepted: {count} suites"
  nist: ["NIST SP 800-52 Rev. 2: ephemeral key exchange preferred"]
  remediation: "Remove TLS_RSA_* and static DH/ECDH suites; keep ECDHE (and DHE with 2048-bit+ groups)."

- id: CIPHER_NO_SERVER_ORDER
  title: "Server lets the client choose the cipher suite"
  severity: low
  plain: >
    Your server lets each visitor's software pick the encryption method, so an old client can choose a
    weaker option even when a stronger one is available.
  technical: "Server did not enforce its own cipher order on: {protocols}"
  nist: ["NIST SP 800-52 Rev. 2: server cipher preference"]
  remediation: "Enable server cipher preference (nginx: ssl_prefer_server_ciphers on; Apache: SSLHonorCipherOrder on)."
  score_impact: {deduct: 2}

- id: DH_WEAK
  title: "Weak Diffie-Hellman parameters"
  severity: medium
  plain: >
    Your server uses a Diffie-Hellman key exchange with a group that is too small. Well-funded attackers
    could break it and decrypt connections.
  technical: "DHE prime is {bits} bits."
  nist: ["NIST SP 800-131A Rev. 2: 2048-bit minimum for finite-field DH"]
  remediation: "Use 2048-bit or larger DH groups (e.g. ffdhe2048), or remove DHE suites and rely on ECDHE."

- id: DH_BROKEN
  title: "Dangerously weak Diffie-Hellman parameters"
  severity: high
  plain: >
    Your server uses a Diffie-Hellman group under 1024 bits. Connections using it can be decrypted with
    published techniques (the Logjam attack).
  technical: "DHE prime is {bits} bits."
  nist: ["NIST SP 800-131A Rev. 2: 2048-bit minimum for finite-field DH"]
  remediation: "Replace the DH parameters with a 2048-bit or larger group, or remove DHE suites."

- id: PQ_NOT_READY
  title: "No post-quantum key exchange"
  severity: info
  plain: >
    Your server does not yet offer hybrid post-quantum key exchange. Traffic recorded today could be
    decrypted in future by a large quantum computer. This is not urgent, but worth planning for.
  technical: "No hybrid ML-KEM group (e.g. X25519MLKEM768) accepted on TLS 1.3."
  nist: ["NIST FIPS 203 (ML-KEM)"]
  remediation: "Upgrade to a TLS library with ML-KEM support (e.g. OpenSSL 3.5+) and enable X25519MLKEM768."

# --- Certificate -----------------------------------------------------------
- id: CERT_EXPIRED
  title: "Certificate has expired"
  severity: critical
  plain: >
    Your server's certificate is past its expiry date. Browsers show a full-page warning, and visitors who
    click through have no assurance they are talking to you.
  technical: "Certificate {subject} expired {not_after}."
  nist: ["NIST SP 800-52 Rev. 2: certificate validity"]
  remediation: "Renew the certificate now and set up automatic renewal (e.g. ACME / Let's Encrypt)."

- id: CERT_NOT_YET_VALID
  title: "Certificate is not yet valid"
  severity: critical
  plain: >
    Your server's certificate has a start date in the future, so browsers reject it. This often means the
    server clock or the certificate dates are wrong.
  technical: "Certificate {subject} valid from {not_before}."
  nist: ["NIST SP 800-52 Rev. 2: certificate validity"]
  remediation: "Check the server clock and reissue the certificate with correct dates."

- id: CERT_UNTRUSTED
  title: "Certificate is not trusted"
  severity: critical
  plain: >
    Browsers do not recognise who issued your certificate (for example, it is self-signed). Visitors see a
    security warning, and an attacker's fake certificate would look no different.
  technical: "Chain verification failed ({reason}) against {store}. {detail}"
  nist: ["NIST SP 800-52 Rev. 2: certificates from a trusted CA"]
  remediation: "Install a certificate issued by a publicly trusted CA, with its full intermediate chain."

- id: CERT_INCOMPLETE_CHAIN
  title: "Certificate chain is incomplete or untrusted"
  severity: high
  plain: >
    Your server does not send all the certificates needed to prove it is trustworthy. Some browsers and
    many apps will refuse to connect.
  technical: "Chain verification failed ({reason}) against {store}. {detail}"
  nist: ["NIST SP 800-52 Rev. 2: complete certificate path"]
  remediation: "Configure the server to send the intermediate certificate(s) along with your certificate."

- id: CERT_HOSTNAME_MISMATCH
  title: "Certificate does not match the server name"
  severity: critical
  plain: >
    The certificate was issued for a different name than the one you scanned, so browsers show a warning.
  technical: "Host {host} not in SAN {san}."
  nist: ["NIST SP 800-52 Rev. 2: server identity verification"]
  remediation: "Issue a certificate that lists this exact host name in its Subject Alternative Name."

- id: CERT_EXPIRING_SOON
  title: "Certificate expires soon"
  severity: medium
  plain: >
    Your certificate expires within 30 days. If it lapses, visitors will see a security warning.
  technical: "Certificate {subject} expires in {days} days ({not_after})."
  nist: ["NIST SP 800-52 Rev. 2: certificate validity"]
  remediation: "Renew the certificate and automate renewal."
  score_impact: {deduct: 5}

- id: CERT_WEAK_KEY
  title: "Certificate key is too short"
  severity: high
  plain: >
    The key in your certificate is shorter than current standards allow, making it easier to forge.
  technical: "{key_type} key of {bits} bits in {subject}."
  nist: ["NIST SP 800-131A Rev. 2: RSA 2048-bit / ECC 224-bit minimum"]
  remediation: "Reissue the certificate with an RSA 2048-bit (or larger) or an ECDSA P-256 key."

- id: CERT_WEAK_SIGNATURE
  title: "Certificate uses a weak signature algorithm"
  severity: high
  plain: >
    Your certificate is signed with an outdated hash function (SHA-1 or MD5) that can be forged.
  technical: "Signature algorithm {algorithm} in {subject}."
  nist: ["NIST SP 800-131A Rev. 2: SHA-1 disallowed for signature generation"]
  remediation: "Reissue the certificate with a SHA-256 (or stronger) signature."

- id: CERT_CHAIN_ORDER
  title: "Certificate chain is sent in the wrong order"
  severity: low
  plain: >
    Your server sends its certificates out of order. Browsers usually cope, but some older clients fail.
  technical: "Each certificate's issuer does not match the next certificate's subject."
  nist: ["NIST SP 800-52 Rev. 2: certificate path"]
  remediation: "List your certificate first, then each intermediate in order, in the server's chain file."

- id: CERT_NO_OCSP_STAPLING
  title: "OCSP stapling is not enabled"
  severity: info
  plain: >
    Your server does not attach proof that its certificate has not been revoked, so browsers must check
    separately (or skip the check).
  technical: "No CertificateStatus message returned for a status_request ClientHello."
  nist: ["NIST SP 800-52 Rev. 2: OCSP stapling should be supported"]
  remediation: "Enable OCSP stapling (nginx: ssl_stapling on; Apache: SSLUseStapling on)."

# --- Server configuration --------------------------------------------------
- id: CONFIG_NO_SECURE_RENEGOTIATION
  title: "Secure renegotiation is not supported"
  severity: medium
  plain: >
    Your server lacks a 2009 fix for a flaw that lets an attacker inject data at the start of a connection.
  technical: "ServerHello did not echo renegotiation_info."
  nist: ["NIST SP 800-52 Rev. 2: renegotiation_info extension required"]
  remediation: "Update the TLS library; all maintained versions support secure renegotiation (RFC 5746)."

- id: CONFIG_NO_FALLBACK_SCSV
  title: "No downgrade protection (TLS_FALLBACK_SCSV)"
  severity: low
  plain: >
    Your server does not detect when a connection has been forced down to an older protocol version.
  technical: "Downgraded ClientHello with TLS_FALLBACK_SCSV was accepted."
  nist: ["NIST SP 800-52 Rev. 2: fallback SCSV (RFC 7507)"]
  remediation: "Update the TLS library, or disable the older protocol versions entirely."

- id: CONFIG_NO_EXTENDED_MASTER_SECRET
  title: "Extended master secret is not supported"
  severity: low
  plain: >
    Your server lacks a protection against a class of attacks that splice two connections together.
  technical: "ServerHello did not echo extended_master_secret on TLS 1.2."
  nist: ["NIST SP 800-52 Rev. 2: extended master secret (RFC 7627)"]
  remediation: "Update the TLS library; RFC 7627 support is standard in current versions."
  score_impact: {deduct: 2}

- id: HSTS_MISSING
  title: "HTTP Strict Transport Security (HSTS) is not set"
  severity: low
  plain: >
    Browsers are not told to always use HTTPS for your site, so a visitor's first request can be
    intercepted and redirected to an unencrypted page.
  technical: "No Strict-Transport-Security header on {url}."
  nist: ["NIST SP 800-52 Rev. 2: HSTS for HTTPS services"]
  remediation: "Add: Strict-Transport-Security: max-age=31536000; includeSubDomains"

- id: HSTS_SHORT
  title: "HSTS max-age is short"
  severity: low
  plain: >
    Your HSTS policy expires quickly, so browsers forget to insist on HTTPS soon after a visit.
  technical: "Strict-Transport-Security max-age={max_age} (under 180 days)."
  nist: ["NIST SP 800-52 Rev. 2: HSTS for HTTPS services"]
  remediation: "Set max-age to at least 31536000 (one year)."
  score_impact: {deduct: 1}

- id: HEADER_SECURITY_MISSING
  title: "Recommended HTTP security headers are missing"
  severity: info
  plain: >
    Your site does not send some standard headers that help browsers block common web attacks.
  technical: "Missing: {missing}"
  nist: ["Not a TLS requirement; OWASP Secure Headers guidance"]
  remediation: "Add X-Content-Type-Options: nosniff, X-Frame-Options (or CSP frame-ancestors) and a Content-Security-Policy."

# --- Vulnerabilities -------------------------------------------------------
- id: VULN_DROWN
  title: "Vulnerable to DROWN"
  severity: critical
  plain: >
    Because SSL 2.0 is enabled, attackers can use it to decrypt modern TLS connections that use the same key.
  technical: "{evidence}"
  nist: ["NIST SP 800-52 Rev. 2: SSL 2.0 shall not be used"]
  remediation: "Disable SSL 2.0 on every server that uses this certificate's key."
  score_impact: {deduct: 0}

- id: VULN_POODLE_SSL
  title: "Vulnerable to POODLE (SSL 3.0)"
  severity: high
  plain: >
    SSL 3.0 with CBC encryption lets an attacker recover secrets such as cookies, one byte at a time.
  technical: "{evidence}"
  nist: ["NIST SP 800-52 Rev. 2: SSL 3.0 shall not be used"]
  remediation: "Disable SSL 3.0."
  score_impact: {deduct: 0}

- id: VULN_BEAST
  title: "Exposed to BEAST"
  severity: low
  plain: >
    CBC encryption on TLS 1.0 or SSL 3.0 is theoretically exposed to the BEAST attack. Modern browsers
    mitigate it, so this mainly matters for old clients.
  technical: "{evidence}"
  nist: ["NIST SP 800-52 Rev. 2: TLS 1.2 minimum"]
  remediation: "Disable TLS 1.0 and SSL 3.0."
  score_impact: {deduct: 0}

- id: VULN_SWEET32
  title: "Vulnerable to SWEET32"
  severity: medium
  plain: >
    64-bit block ciphers let an attacker who records a long connection recover secrets.
  technical: "{evidence}"
  nist: ["NIST SP 800-131A Rev. 2: TDEA disallowed for encryption after 2023"]
  remediation: "Remove 3DES and other 64-bit block cipher suites."
  score_impact: {deduct: 0}

- id: VULN_RC4
  title: "RC4 biases exploitable"
  severity: high
  plain: >
    RC4 encryption leaks patterns that let attackers recover parts of repeated secrets such as cookies.
  technical: "{evidence}"
  nist: ["NIST SP 800-52 Rev. 2: RC4 not approved"]
  remediation: "Remove RC4 cipher suites."
  score_impact: {deduct: 0}

- id: VULN_FREAK
  title: "Vulnerable to FREAK"
  severity: high
  plain: >
    Export RSA suites let an attacker force a weak key exchange and decrypt the connection.
  technical: "{evidence}"
  nist: ["NIST SP 800-131A Rev. 2: key lengths below 112 bits disallowed"]
  remediation: "Remove RSA_EXPORT cipher suites."
  score_impact: {deduct: 0}

- id: VULN_LOGJAM
  title: "Vulnerable to Logjam"
  severity: high
  plain: >
    Weak Diffie-Hellman settings let an attacker downgrade and decrypt connections.
  technical: "{evidence}"
  nist: ["NIST SP 800-131A Rev. 2: 2048-bit minimum for finite-field DH"]
  remediation: "Remove DHE_EXPORT suites and use 2048-bit or larger DH groups."
  score_impact: {deduct: 10}

- id: VULN_LUCKY13
  title: "Exposed to Lucky Thirteen"
  severity: low
  plain: >
    CBC-mode encryption may leak information through tiny timing differences. Current libraries mitigate
    it, but AEAD encryption avoids the problem.
  technical: "{evidence}"
  nist: ["NIST SP 800-52 Rev. 2: prefer AEAD cipher suites"]
  remediation: "Prefer AES-GCM / ChaCha20-Poly1305 and remove CBC suites when possible."
  score_impact: {deduct: 0}

- id: VULN_CRIME
  title: "TLS compression enabled (CRIME)"
  severity: high
  plain: >
    Your server compresses encrypted data. An attacker who can make a browser send requests can use the
    changing sizes to work out secrets such as session cookies.
  technical: "{evidence}"
  nist: ["NIST SP 800-52 Rev. 2: TLS compression shall not be used"]
  remediation: "Disable TLS-level compression (it is off by default in current libraries)."
