# Local scan targets for integration tests (TRD §9). Bound to localhost only.
services:
  modern:
    build: ./modern
    ports: ["127.0.0.1:8443:443"]
  tls13-only:
    build: ./pq
    command: ["openssl", "s_server", "-accept", "443", "-cert", "/certs/cert.pem", "-key", "/certs/key.pem",
              "-tls1_3", "-www"]
    ports: ["127.0.0.1:8445:443"]
  pq:
    build: ./pq
    ports: ["127.0.0.1:8446:443"]
