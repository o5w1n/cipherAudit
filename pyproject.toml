[project]
name = "cipheraudit"
version = "0.1.0"
description = "TLS configuration scanner with plain-language, NIST-referenced findings"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "cryptography>=43",
    "certifi>=2024.2.2",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
cipheraudit = "cipheraudit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cipheraudit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs local docker targets or network access"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.13"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["cipheraudit.wire.*", "cipheraudit.core.*"]
strict = true
